<header class="entry-heading" id="entry-heading">
<p class="entry-kicker">YOUR WORDS. YOUR RECORD.</p>
<h1>今天的运动，讲给我听。</h1>
</header>
<div class="entry-bubble" id="entry-bubble" role="status">我在这里陪你。</div>
<div class="record-heading" hidden="" id="record-heading"><h2 id="record-title">Log Your Workout</h2><p id="record-subtitle">Write it down, step by step!</p></div>
<p class="hero-subtitle" hidden="" id="hero-subtitle">You completed today’s workout!</p>
<p class="hero-quote" hidden="" id="hero-quote">Small steps make<br/>a stronger you.</p>
<div class="record-card" id="record-card"></div>
<section aria-label="填写运动记录" class="entry-panel" id="entry-panel">
<form id="entry-form" novalidate="">
<label class="field"><span>运动项目</span><input autocomplete="off" id="field-activity" maxlength="40" name="activity" placeholder="例如：跑步" required="" type="text"/></label>
<label class="field"><span>距离</span><span class="input-wrap"><input autocomplete="off" id="field-distance" inputmode="decimal" maxlength="16" name="distanceKm" pattern="[0-9]*[.]?[0-9]*" placeholder="5.2" required="" type="text"/><span aria-hidden="true" class="unit">km</span></span></label>
<label class="field"><span>时长</span><span class="input-wrap"><input autocomplete="off" id="field-duration" inputmode="decimal" maxlength="16" name="durationMinutes" pattern="[0-9]*[.]?[0-9]*" placeholder="30" required="" type="text"/><span aria-hidden="true" class="unit">分钟</span></span></label>
<label class="field"><span>一句话备注</span><input autocomplete="off" id="field-notes" maxlength="32" name="notes" placeholder="今天感觉怎么样？" required="" type="text"/></label>
</form>
</section>

<div class="wave-wrap"><canvas aria-label="实时麦克风音量" height="210" id="voice-wave" width="640"></canvas></div>
<p aria-live="polite" class="speech-transcript" id="speech-transcript">说说今天做了什么运动。</p>
<p class="voice-hint" id="voice-hint">松开，交给我整理</p>
<button class="cancel-voice" id="cancel-voice" type="button">取消</button>
</section>

<button aria-describedby="hold-help" aria-label="确认并继续；长按可以说话" class="primary hold-button" id="confirm-entry" type="button">
<svg aria-hidden="true" class="mic-icon" viewbox="0 0 24 24"><rect height="11" rx="3" width="6" x="9" y="3"></rect><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3M8 21h8"></path></svg>
